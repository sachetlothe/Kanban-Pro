services:
  backend:
    build: ./backend
    container_name: kanban-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      CLIENT_URL: http://localhost
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: kanban-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped