---
- name: Deploy Kanban application
  hosts: kanban
  become: true

  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Login to Artifact Registry
      shell: |
        echo "{{ artifact_token }}" | docker login \
          -u oauth2accesstoken \
          --password-stdin \
          https://us-central1-docker.pkg.dev
      no_log: true

    - name: Pull backend image
      command: docker pull us-central1-docker.pkg.dev/river-hold-484204-h9/kanban-repo/backend:latest

    - name: Pull frontend image
      command: docker pull us-central1-docker.pkg.dev/river-hold-484204-h9/kanban-repo/frontend:latest

    - name: Remove old backend container
      command: docker rm -f kanban-backend
      failed_when: false

    - name: Remove old frontend container
      command: docker rm -f kanban-frontend
      failed_when: false

    - name: Run backend container
      command: >
        docker run -d
        --name kanban-backend
        -p 5000:5000
        -e PORT=5000
        -e MONGODB_URI="{{ mongodb_uri }}"
        -e CLIENT_URL="http://{{ ansible_host }}"
        --restart unless-stopped
        us-central1-docker.pkg.dev/river-hold-484204-h9/kanban-repo/backend:latest
      no_log: true

    - name: Run frontend container
      command: >
        docker run -d
        --name kanban-frontend
        -p 80:80
        --restart unless-stopped
        us-central1-docker.pkg.dev/river-hold-484204-h9/kanban-repo/frontend:latest